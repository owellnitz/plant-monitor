[target.riscv32imc-unknown-none-elf]
# flash.sh flashes the OTA layout (two app slots + otadata + config) rather
# than espflash's single-app default, and clears the OTA boot pointer first so
# `cargo run` always runs what it just flashed — see the script for why.
runner = "./flash.sh"

[env]

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["core"]
