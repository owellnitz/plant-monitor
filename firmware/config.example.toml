# Copy this file to config.toml and fill in your values, then write it to the
# device's config partition with ./provision.sh (run once per device).
# config.toml is gitignored; it holds the WiFi password.

wifi_ssid = "your-ssid"
wifi_password = "your-password"

# MQTT broker IPv4 address (no DNS resolution) and port.
mqtt_host = "192.168.1.10"
mqtt_port = "1883"

# Backend HTTP port for OTA update checks (optional, defaults to 5001).
# The backend is expected on the same host as the broker.
# backend_port = "5001"

# Sensor calibration: raw ADC in air (0 %) and in water (100 %), read from the
# `raw` field of the published payload (see README). Optional; both or neither.
# raw_dry = "4095"
# raw_wet = "3130"
